steps:
  # 构建Docker镜像
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${REPO_NAME}:${COMMIT_SHA}'
      - '.'

  # 推送Docker镜像到容器注册表
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${REPO_NAME}:${COMMIT_SHA}'

  # 部署到Google Cloud Run（可选，根据需要调整）
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${REPO_NAME}'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/${REPO_NAME}:${COMMIT_SHA}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/${PROJECT_ID}/${REPO_NAME}:${COMMIT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY